[pc]
mem=8M
cpu=5
bios=bios.bin
vga_bios=vgabios.bin
redirector=1

; Disk images
; FreeDOS 1.3 x86BOOT (FDISK+FORMAT) — după partitionare/formatare HDD, schimbă înapoi la fda=fdd0.img (DR-DOS) sau fda=DISK01.IMG (Windows SETUP)
fda=freedos.img
hdd=hdd.img

[cpu]
gen=4
fpu=1

; validated on Olimex RP2350PC Rev.A1: 378/133 (do NOT use 504 — unvalidated on this board)
[frank-386]
pcspeaker=1
adlib=1
soundblaster=1
mouse=1
cpu_freq=378
psram_freq=133
